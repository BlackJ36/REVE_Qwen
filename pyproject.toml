[project]
name = "reve-qwen"
version = "0.1.0"
description = "BCI-to-text pipeline: REVE EEG encoder + Qwen3-VL LoRA fine-tuning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.45.0",
    "peft>=0.13.0",
    "accelerate>=1.0.0",
    "deepspeed>=0.15.0",
    "bitsandbytes>=0.42.0",
    "unsloth>=2024.12",
    "modelscope>=1.20.0",
    "braindecode>=1.3.0",
    "mne>=1.6.0",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
    "einops",
    "tqdm",
    "xformers",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
